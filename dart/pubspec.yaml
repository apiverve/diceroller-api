name: apiverve_diceroller
description: "Dice Roller is a dice API that simulates RPG dice rolls using standard notation like 3d6 or 2d20 with optional modifiers. It outputs the individual die outcomes, die count, and the sum of all rolls."
version: 1.2.4
homepage: https://apiverve.com/marketplace/diceroller?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/diceroller-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
